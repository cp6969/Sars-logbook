{% extends "base.html" %}
{% block title %}Settings — SARS Logbook{% endblock %}
{% block content %}
{% if setup %}<p class="notice">Set up your vehicle to get started.</p>{% endif %}

<div class="card narrow">
  <h2>Vehicle</h2>
  <form method="post" action="/settings/vehicle">
    <label>Registration<input type="text" name="registration" value="{{ vehicle.registration if vehicle else '' }}" required></label>
    <label>Make<input type="text" name="make" value="{{ vehicle.make if vehicle else '' }}"></label>
    <label>Model<input type="text" name="model" value="{{ vehicle.model if vehicle else '' }}"></label>
    <label>Engine capacity (cc)<input type="number" name="engine_capacity_cc" value="{{ vehicle.engine_capacity_cc if vehicle else '' }}"></label>
    <label>Tax year start date<input type="date" name="tax_year_start_date" value="{{ vehicle.tax_year_start_date if vehicle else '2026-03-01' }}" required></label>
    <label>Opening odometer (at tax year start)<input type="number" step="0.1" name="tax_year_opening_odometer" value="{{ vehicle.tax_year_opening_odometer if vehicle else '' }}" required></label>
    <button type="submit" class="btn btn-primary">Save vehicle</button>
  </form>
</div>

<div class="card narrow">
  <h2>Owner details</h2>
  <form method="post" action="/settings/owner">
    <label>Name (shown on the exported logbook)<input type="text" name="owner_display_name" value="{{ owner_settings.owner_display_name if owner_settings else '' }}" required></label>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
