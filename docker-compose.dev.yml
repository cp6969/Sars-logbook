# LOCAL/DEV VERIFICATION ONLY -- not the real deploy path (that's
# deploy.sh, matching the sibling PO Bridge app's own convention of plain
# docker build/run, no compose, since Unraid doesn't ship docker-compose).
# This file exists purely so the app can be built and exercised end-to-end
# in a dev sandbox that does have docker-compose available.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sars_logbook
      POSTGRES_USER: sars_logbook
      POSTGRES_PASSWORD: devpassword
    volumes:
      - ./data/dev-postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sars_logbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sars_logbook:devpassword@db:5432/sars_logbook
      APP_SECRET_KEY: dev-secret-not-for-production
      GOOGLE_MAPS_API_KEY: ""
    ports:
      - "8090:8080"
